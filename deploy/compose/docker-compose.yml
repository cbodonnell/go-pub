services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: cheebz/go-pub
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      PORT: 8080
      SERVER_NAME: ${SERVER_NAME:-localhost:8080}
      PROTOCOL: ${PROTOCOL:-http}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-gopub}
      DB_USER: ${DB_USER:-gopub}
      DB_PASSWORD: ${DB_PASSWORD:-gopub}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_KEY: ${JWT_KEY:-changeme-set-a-real-secret}
      REGISTER: ${REGISTER:-true}
      UPLOAD_DIR: /app/uploads/
      RSA_PUBLIC_KEY: /app/keys/public.pem
      RSA_PRIVATE_KEY: /app/keys/private.pem
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - rsa-keys:/app/keys
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-gopub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gopub}
      POSTGRES_DB: ${DB_NAME:-gopub}
    volumes:
      - ../db/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gopub} -d ${DB_NAME:-gopub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres-data:
  rsa-keys:
  uploads:
